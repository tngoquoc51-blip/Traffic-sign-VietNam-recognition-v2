<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập Admin — Bàn Kiểm Định</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body{align-items:center; min-height:100vh;}
  .login-card{
    width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:28px 26px; box-shadow:0 40px 90px rgba(0,0,0,.55);
  }
  .login-card .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .login-card .brand .mark{
    width:34px; height:34px; border-radius:9px; background:var(--cyan);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; color:#04211C; font-size:14px;
  }
  .login-card h1{font-family:'Space Grotesk'; font-weight:700; font-size:19px;}
  .login-card p.sub{font-size:12px; color:var(--ink-mute); margin-top:2px;}
  .login-card form{margin-top:20px; display:flex; flex-direction:column; gap:14px;}
  .login-card label{font-size:12px; color:var(--ink-mute); font-weight:600; margin-bottom:6px; display:block;}
  .login-card input{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-family:'JetBrains Mono'; font-size:13px;
  }
  .login-card input:focus{outline:none; border-color:var(--cyan);}
  .login-card button{
    margin-top:6px; padding:12px; border-radius:9px; border:none;
    background:var(--cyan); color:#04211C; font-family:'Inter'; font-weight:700; font-size:13.5px;
    cursor:pointer;
  }
  .flash-err{
    background:rgba(226,53,47,.12); border:1px solid rgba(226,53,47,.4); color:#ff8a84;
    font-size:12.5px; padding:10px 12px; border-radius:9px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="mark">BK</div>
      <div>
        <h1>Đăng nhập Admin</h1>
        <p class="sub">Bàn Kiểm Định · Nhận diện biển báo giao thông VN</p>
      </div>
    </div>

    {% if error %}
    <div class="flash-err" style="margin-bottom:14px;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div>
        <label>Tài khoản</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label>Mật khẩu</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Đăng nhập</button>
    </form>
  </div>
</body>
</html>
